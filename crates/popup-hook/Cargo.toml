[package]
name = "litetray-popup-hook"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
litetray-adapter-protocol = { path = "../adapter-protocol" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
