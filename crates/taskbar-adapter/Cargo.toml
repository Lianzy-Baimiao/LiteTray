[package]
name = "litetray-taskbar-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
litetray-adapter-protocol = { path = "../adapter-protocol" }
windows-link = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange"] }
