[package]
name = "litetray-adapter-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
publish = false

[features]
default = []
# Adds the 26200.8037 and LTSC 26100.1742 static candidates for isolated VMs only.
# Default builds exclude all profiles under profiles/lab.
compatibility-lab = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
