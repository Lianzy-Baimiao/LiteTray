[package]
name = "litetray"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Windows taskbar, clock, calendar and weather companion"
repository = "https://github.com/Lianzy-Baimiao/LiteTray"
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/taskbar-adapter", "crates/adapter-protocol", "crates/popup-hook"]
exclude = ["tools/xaml-bindgen"]
resolver = "3"

[features]
default = []
# Reserved for static candidates pending validation in disposable VMs.
# The five independently reviewed profiles are in the default registry.
# Release packages always use the default feature set.
compatibility-lab = ["litetray-adapter-protocol/compatibility-lab"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "gzip", "json"] }
url = "2.5"
sha2 = "0.10"
tyme4rs = "=1.5.1"
litetray-adapter-protocol = { path = "crates/adapter-protocol" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Devices_Display",
  "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"
] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "UI_ViewManagement", "Win32_System_WinRT", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "LiteTray"
path = "src/main.rs"
