[package]
name = "litetray"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Windows taskbar, clock, calendar and weather companion"
repository = "https://github.com/Lianzy-Baimiao/LiteTray"
publish = false

[workspace]
members = ["crates/taskbar-adapter"]
resolver = "3"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "gzip", "json"] }
url = "2.5"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"
] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "Win32_System_WinRT"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "LiteTray"
path = "src/main.rs"
