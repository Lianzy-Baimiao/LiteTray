name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Native UI tests launch isolated desktop processes. Serial execution
      # avoids desktop/font-service contention skewing the latency budget.
      - run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Check the opt-in candidate registry separately
        run: cargo test -p litetray-adapter-protocol --locked --features compatibility-lab -- --test-threads=1
      - name: Check background compatibility detection and snapshot export
        run: cargo test --bin LiteTray compatibility_check_worker_and_export_preserve_the_real_disk_snapshot -- --ignored --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Release artifacts always use the default registry, never lab profiles.
      - run: cargo build --workspace --release --locked
      - name: Check exception callback lifetime in an isolated process
        shell: pwsh
        run: ./tools/Test-FaultBeacon.ps1 -AdapterPath ./target/release/litetray_taskbar_adapter.dll
      - name: Check disk-only compatibility export without profile or adapter DLLs
        shell: pwsh
        run: ./tools/Test-Compatibility.ps1 -BinaryPath ./target/release/LiteTray.exe
      - name: Check XAML clock apply and restore in an isolated process
        shell: pwsh
        run: ./tools/Test-XamlClock.ps1 -BinaryPath ./target/release/LiteTray.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LiteTray-windows-x64
          path: |
            target/release/LiteTray.exe
            target/release/litetray_taskbar_adapter.dll
            target/release/litetray_popup_hook.dll
  candidate-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/compatibility/requirements.txt
      - run: python -m unittest discover -s tools/compatibility -p test_evidence.py -v
